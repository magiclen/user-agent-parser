[package]
name = "user-agent-parser"
version = "0.4.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/magiclen/user-agent-parser"
homepage = "https://magiclen.org/user-agent-parser"
keywords = ["useragent", "user-agent", "uap", "rocket", "axum"]
categories = ["parser-implementations"]
description = "A parser to get the product, OS, device, cpu, and engine information from a user agent, inspired by https://github.com/faisalman/ua-parser-js and https://github.com/ua-parser/uap-core"
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
yaml-rust = { version = "0.11", package = "yaml-rust2" }
regex = "1"

rocket = { version = "0.5", optional = true }

# `tokio` is pulled in by the `axum` feature only to run the axum example.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }

[features]
rocket = ["dep:rocket"]
axum = ["dep:axum", "dep:tokio"]

[[example]]
name = "rocket"
required-features = ["rocket"]

[[example]]
name = "axum"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]